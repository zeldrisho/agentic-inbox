name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vite+ verify (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the Vite+ (vp) toolchain
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Generate types
        run: |
          vp run cf-typegen
          vp exec react-router typegen

      - name: Lint, format & type check
        run: vp check

      - name: Test (coverage gate ≥80%, ai.ts ≥90%)
        run: vp test run --coverage

      - name: Build
        run: vp run build
